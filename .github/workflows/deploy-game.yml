name: Deploy Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract game files (game.zip + assets.zip + media.zip)
        run: |
          mkdir -p public
          unzip -o game.zip -d public
          unzip -o assets.zip -d public
          unzip -o media.zip -d public
          echo "Isi folder public setelah extract:"
          find public -maxdepth 4
          echo "----"
          echo "Mencari index.html di manapun posisinya:"
          find public -iname "index.html"

      - name: Tentukan folder yang benar-benar berisi index.html
        id: findroot
        run: |
          WEBROOT=$(dirname "$(find public -iname 'index.html' | head -n 1)")
          if [ -z "$WEBROOT" ]; then
            echo "index.html TIDAK KETEMU di manapun! Cek log step sebelumnya." >&2
            exit 1
          fi
          echo "Ketemu index.html di: $WEBROOT"
          echo "webroot=$WEBROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.findroot.outputs.webroot }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
