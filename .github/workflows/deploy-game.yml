name: Deploy Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract game.zip dan cari lokasi index.html
        id: findroot
        run: |
          mkdir -p public
          unzip -o game.zip -d public
          echo "Isi folder public setelah extract game.zip:"
          find public -maxdepth 4
          echo "----"
          WEBROOT=$(dirname "$(find public -iname 'index.html' | head -n 1)")
          if [ -z "$WEBROOT" ]; then
            echo "index.html TIDAK KETEMU di dalam game.zip! Cek log di atas." >&2
            exit 1
          fi
          echo "Ketemu index.html di: $WEBROOT"
          echo "webroot=$WEBROOT" >> "$GITHUB_OUTPUT"

      - name: Extract assets.zip dan media.zip LANGSUNG ke folder index.html
        run: |
          WEBROOT="${{ steps.findroot.outputs.webroot }}"
          unzip -o assets.zip -d "$WEBROOT"
          unzip -o media.zip -d "$WEBROOT"
          echo "Isi folder webroot setelah semua diextract:"
          find "$WEBROOT" -maxdepth 2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.findroot.outputs.webroot }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
